version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Expo SDK packages are version-coupled; upgrade them together via
    # `npx expo install expo@latest --fix` rather than one-by-one PRs.
    ignore:
      - dependency-name: 'expo*'
      - dependency-name: 'react-native*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@expo/*'
      # The styling stack is version-coupled too: gluestack-ui v5 requires
      # NativeWind v5 / Tailwind v4. Migrate majors deliberately (see AGENTS.md).
      - dependency-name: 'nativewind'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: '@gluestack-ui/*'
        update-types: ['version-update:semver-major']
      # jest-expo pins its own Jest major.
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
